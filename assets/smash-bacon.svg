<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bunGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DE893F"/>
      <stop offset="100%" stop-color="#AD5F1A"/>
    </linearGradient>
    <linearGradient id="smashPatty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2810"/>
      <stop offset="100%" stop-color="#2D1505"/>
    </linearGradient>
    <linearGradient id="baconGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B1E0F"/>
      <stop offset="35%" stop-color="#E57373"/>
      <stop offset="70%" stop-color="#8B1E0F"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="210" rx="105" ry="16" fill="#cfd8dc" opacity="0.6"/>

  <!-- Bottom Bun -->
  <path d="M 65 178 C 65 200 235 200 235 178 C 235 170 65 170 65 178 Z" fill="url(#bunGradDark)"/>

  <!-- Smash Patty 2 (Bottom) -->
  <rect x="52" y="156" width="196" height="18" rx="8" fill="url(#smashPatty)"/>

  <!-- Cheese Layer 1 -->
  <polygon points="50,154 250,154 225,170 180,156 150,172 120,156 75,168" fill="#FFB300"/>

  <!-- Smash Patty 1 (Top) -->
  <rect x="50" y="134" width="200" height="20" rx="9" fill="url(#smashPatty)"/>

  <!-- Bacon Strip 1 -->
  <path d="M 55 128 Q 100 120 150 132 Q 200 122 245 130 Q 248 138 240 142 Q 195 130 150 142 Q 100 128 58 136 Z" fill="url(#baconGrad)"/>

  <!-- Bacon Strip 2 (overlapping angle) -->
  <path d="M 60 136 Q 110 144 160 134 Q 210 145 240 138 Q 242 146 235 149 Q 205 140 160 146 Q 110 138 62 144 Z" fill="url(#baconGrad)" opacity="0.95"/>

  <!-- Cheddar drip -->
  <path d="M 80 128 C 90 128 95 148 100 148 C 105 148 110 128 120 128 C 130 128 135 155 142 155 C 148 155 155 128 175 128 C 185 128 190 145 198 145 C 205 145 210 128 225 128" fill="#FFC107"/>

  <!-- Caramelized Onions -->
  <path d="M 85 122 Q 150 115 215 122" stroke="#795548" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 100 118 Q 140 126 180 119" stroke="#8D6E63" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Top Bun -->
  <path d="M 60 120 C 60 48 240 48 240 120 Z" fill="url(#bunGradDark)"/>

  <!-- Bun Gloss -->
  <path d="M 90 82 C 110 65 170 60 200 70" stroke="#FFE082" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45"/>
  <ellipse cx="150" cy="62" rx="35" ry="8" fill="#FFF8E1" opacity="0.2"/>
</svg>
