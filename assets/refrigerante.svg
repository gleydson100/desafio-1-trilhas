<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="25%" stop-color="#FF5252"/>
      <stop offset="70%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="218" rx="55" ry="12" fill="#cfd8dc" opacity="0.6"/>

  <!-- Straw (Back segment) -->
  <path d="M 175 25 L 160 85" stroke="url(#strawGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 195 12 L 175 25" stroke="url(#strawGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Cup Body -->
  <polygon points="105,90 195,90 180,210 120,210" fill="url(#cupGrad)"/>

  <!-- Cup decorative white wave stripe -->
  <path d="M 107 140 Q 150 160 193 140 L 191 155 Q 150 175 109 155 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Water drops / condensation -->
  <ellipse cx="125" cy="120" rx="2" ry="3.5" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="170" cy="130" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="135" cy="180" rx="2" ry="3" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="165" cy="175" rx="2" ry="3.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- Cup Lid Rim -->
  <path d="M 98 88 C 98 80 202 80 202 88 L 200 95 C 200 98 100 98 100 95 Z" fill="url(#lidGrad)"/>
  
  <!-- Lid Dome -->
  <ellipse cx="150" cy="85" rx="46" ry="10" fill="#ECEFF1"/>
  <ellipse cx="150" cy="83" rx="24" ry="6" fill="#CFD8DC"/>
  <ellipse cx="160" cy="84" rx="7" ry="4" fill="#90A4AE"/>

  <!-- Refreshment splash / sparkles -->
  <circle cx="95" cy="70" r="3" fill="#81D4FA" opacity="0.8"/>
  <circle cx="85" cy="85" r="2" fill="#81D4FA" opacity="0.6"/>
  <circle cx="210" cy="65" r="2.5" fill="#81D4FA" opacity="0.7"/>
  <circle cx="218" cy="80" r="3.5" fill="#81D4FA" opacity="0.8"/>
</svg>
