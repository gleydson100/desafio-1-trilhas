<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="fryGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="fryGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="215" rx="80" ry="14" fill="#cfd8dc" opacity="0.6"/>

  <!-- Fries in background -->
  <polygon points="105,60 120,60 125,160 100,160" fill="url(#fryGrad2)" transform="rotate(-18 112 110)"/>
  <polygon points="120,40 138,40 140,160 120,160" fill="url(#fryGrad1)" transform="rotate(-8 130 100)"/>
  <polygon points="142,32 160,32 158,160 140,160" fill="url(#fryGrad2)"/>
  <polygon points="165,38 182,38 178,160 160,160" fill="url(#fryGrad1)" transform="rotate(7 172 100)"/>
  <polygon points="180,55 198,55 190,160 175,160" fill="url(#fryGrad2)" transform="rotate(16 188 110)"/>

  <!-- Fries in foreground -->
  <polygon points="112,70 128,70 130,165 110,165" fill="url(#fryGrad1)" transform="rotate(-12 120 115)"/>
  <polygon points="135,50 152,50 150,170 132,170" fill="url(#fryGrad2)" transform="rotate(3 142 110)"/>
  <polygon points="155,58 172,58 168,170 150,170" fill="url(#fryGrad1)" transform="rotate(11 162 115)"/>

  <!-- Herbs / Seasoning dots -->
  <circle cx="123" cy="85" r="2" fill="#2E7D32"/>
  <circle cx="145" cy="72" r="2.5" fill="#C62828"/>
  <circle cx="160" cy="90" r="1.8" fill="#2E7D32"/>
  <circle cx="138" cy="110" r="2" fill="#2E7D32"/>
  <circle cx="170" cy="105" r="2" fill="#C62828"/>
  <circle cx="118" cy="130" r="2" fill="#2E7D32"/>

  <!-- Fry Box / Pocket -->
  <path d="M 85 130 L 98 210 L 202 210 L 215 130 C 180 145 120 145 85 130 Z" fill="url(#boxGrad)"/>
  <path d="M 85 130 C 120 145 180 145 215 130 L 210 120 C 180 135 120 135 90 120 Z" fill="#D32F2F" opacity="0.5"/>

  <!-- Box emblem / logo accent -->
  <circle cx="150" cy="172" r="18" fill="#FFF9C4"/>
  <path d="M 142 165 L 158 165 L 155 182 L 145 182 Z" fill="#E53935"/>
  <rect x="144" y="157" width="3" height="10" fill="#FBC02D"/>
  <rect x="149" y="154" width="3" height="13" fill="#FBC02D"/>
  <rect x="154" y="156" width="3" height="11" fill="#FBC02D"/>
</svg>
